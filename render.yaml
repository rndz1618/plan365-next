services:
  - type: web
    name: plan365
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plan365-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: plan365
          type: web
          property: hostport
      - key: NODE_ENV
        value: production

databases:
  - name: plan365-db
    databaseName: plan365
    plan: starter
    region: singapore
